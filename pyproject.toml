[project]
name = "revit-mcp-server"
version = "0.2.0"
description = "MCP server that lets AI assistants design, edit, and analyze Autodesk Revit models through pyRevit Routes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Talal Ahmed" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
